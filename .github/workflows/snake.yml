name: Generate Contribution Snake Animation

on:
  # Schedule automated runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Enable manual triggering via Actions tab
  workflow_dispatch:
  # Trigger on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate Snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Step 1: Generate contribution grid snake animation SVGs (supporting light & dark palettes)
      - name: Generate contribution grid snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: Deploy generated SVG artifacts to the output branch
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
