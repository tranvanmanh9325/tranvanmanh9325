<svg
  width="300"
  height="190"
  viewBox="0 0 300 190"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Top Languages</title>
  <desc id="descId">Most Used Programming Languages by tranvanmanh9325</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f80ed;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100% - 100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #434d58;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size: 12px; }
    }
    .bold { font-weight: 700; }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #434d58;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .progress-background { fill: #ddd; }

    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* --- Glowing Pulse and Border Beam Animations --- */
    @keyframes borderPulse {
      0%, 100% {
        stroke: #e4e2e2;
        stroke-opacity: 0.6;
        stroke-width: 1;
      }
      50% {
        stroke: #2563eb;
        stroke-opacity: 1;
        stroke-width: 1.5;
      }
    }

    @keyframes beamFlow {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -960;
      }
    }

    @keyframes shimmerMove {
      0% {
        transform: translateX(-80px);
      }
      100% {
        transform: translateX(270px);
      }
    }

    @keyframes dotBreath {
      0%, 100% {
        transform: scale(1);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.18);
        opacity: 1;
      }
    }

    .card-base-border {
      animation: borderPulse 4s ease-in-out infinite;
    }

    .border-beam {
      stroke-dasharray: 90 870;
      animation: beamFlow 6s linear infinite;
    }

    .shimmer-bar {
      animation: shimmerMove 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .lang-dot-anim {
      transform-box: fill-box;
      transform-origin: center;
      animation: dotBreath 3s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-base-border, .border-beam, .shimmer-bar, .lang-dot-anim {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    data-testid="card-bg"
    class="card-bg"
    x="0.5"
    y="0.5"
    rx="6"
    height="189"
    width="299"
    fill="#fffefe"
  />
  <!-- Base Pulsing Border -->
  <rect
    class="card-base-border"
    x="0.5"
    y="0.5"
    rx="6"
    height="189"
    width="299"
    fill="none"
    stroke="#e4e2e2"
    stroke-width="1"
  />
  <!-- Border Beam Effect -->
  <rect
    class="border-beam"
    x="0.5"
    y="0.5"
    rx="6"
    height="189"
    width="299"
    fill="none"
    stroke="url(#beamGradient)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <g
    data-testid="card-title"
    transform="translate(25, 35)"
  >
    <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Most Used Languages</text>
    </g>
  </g>

  <g
    data-testid="main-card-body"
    transform="translate(0, 55)"
  >
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="0"
        y="0"
        width="114.95"
        height="8"
        fill="#DA5B0B"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="114.95"
        y="0"
        width="91.43"
        height="8"
        fill="#3572A5"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="206.38"
        y="0"
        width="15.44"
        height="8"
        fill="#f1e05a"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="221.82"
        y="0"
        width="19.67"
        height="8"
        fill="#3178c6"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="231.49"
        y="0"
        width="16.15"
        height="8"
        fill="#b07219"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="237.64"
        y="0"
        width="15.46"
        height="8"
        fill="#555555"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="243.1"
        y="0"
        width="14.25"
        height="8"
        fill="#e34c26"
      />
      <rect
        mask="url(#rect-mask)"
        data-testid="lang-progress"
        x="247.35"
        y="0"
        width="12.66"
        height="8"
        fill="#663399"
      />

      <!-- Shimmer Bar Reveal Effect -->
      <g mask="url(#rect-mask)">
        <rect
          class="shimmer-bar"
          x="0"
          y="0"
          width="60"
          height="8"
          fill="url(#shimmerGradient)"
        />
      </g>

      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          <g transform="translate(0, 0)">
            <g class="stagger" style="animation-delay: 450ms">
              <circle cx="5" cy="6" r="5" fill="#DA5B0B" class="lang-dot-anim" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                Jupyter Notebook 45.98%
              </text>
            </g>
          </g>
          <g transform="translate(0, 25)">
            <g class="stagger" style="animation-delay: 600ms">
              <circle cx="5" cy="6" r="5" fill="#3572A5" class="lang-dot-anim" style="animation-delay: 0.5s" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                Python 36.57%
              </text>
            </g>
          </g>
          <g transform="translate(0, 50)">
            <g class="stagger" style="animation-delay: 750ms">
              <circle cx="5" cy="6" r="5" fill="#f1e05a" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                JavaScript 6.17%
              </text>
            </g>
          </g>
          <g transform="translate(0, 75)">
            <g class="stagger" style="animation-delay: 900ms">
              <circle cx="5" cy="6" r="5" fill="#3178c6" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                TypeScript 3.87%
              </text>
            </g>
          </g>
        </g>
        <g transform="translate(150, 0)">
          <g transform="translate(0, 0)">
            <g class="stagger" style="animation-delay: 450ms">
              <circle cx="5" cy="6" r="5" fill="#b07219" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                Java 2.46%
              </text>
            </g>
          </g>
          <g transform="translate(0, 25)">
            <g class="stagger" style="animation-delay: 600ms">
              <circle cx="5" cy="6" r="5" fill="#555555" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                C 2.18%
              </text>
            </g>
          </g>
          <g transform="translate(0, 50)">
            <g class="stagger" style="animation-delay: 750ms">
              <circle cx="5" cy="6" r="5" fill="#e34c26" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                HTML 1.70%
              </text>
            </g>
          </g>
          <g transform="translate(0, 75)">
            <g class="stagger" style="animation-delay: 900ms">
              <circle cx="5" cy="6" r="5" fill="#663399" />
              <text data-testid="lang-name" x="15" y="10" class="lang-name">
                CSS 1.06%
              </text>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </g>
</svg>
