<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-label="Top Languages 3D Stats Dashboard">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#161b22" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#090d13" stop-opacity="0.98" />
    </linearGradient>

    <!-- Slab 3D Bottom Edge Gradient -->
    <linearGradient id="slabEdgeDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Bar Gradients with 3D sheen -->
    <linearGradient id="gradJupyter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DA5B0B" />
      <stop offset="85%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <linearGradient id="gradPython" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b5b84" />
      <stop offset="80%" stop-color="#3572A5" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="gradJS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4c33d" />
      <stop offset="80%" stop-color="#f1e05a" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="gradTS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#235a96" />
      <stop offset="80%" stop-color="#3178c6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="gradJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f5b13" />
      <stop offset="80%" stop-color="#b07219" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Recessed Track Gradient -->
    <linearGradient id="trackBgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#1f242c" />
    </linearGradient>

    <!-- Futuristic Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    /* 3D Perspective + Floating Oscillation */
    .dashboard-container {
      transform-box: fill-box;
      transform-origin: 350px 100px;
      animation: floatBobbing 3s ease-in-out infinite;
    }

    @keyframes floatBobbing {
      0%, 100% {
        transform: perspective(800px) rotateX(8deg) translateY(0px);
      }
      50% {
        transform: perspective(800px) rotateX(8deg) translateY(-5px);
      }
    }

    /* Telemetry Pulse Indicator */
    @keyframes pulseLed {
      0%, 100% { opacity: 1; r: 3.5; }
      50% { opacity: 0.4; r: 2.5; }
    }
    .status-led {
      animation: pulseLed 2s ease-in-out infinite;
    }

    /* Bar Growth Animations (scaleX with absolute transform-origin) */
    .bar-anim-1 {
      transform-origin: 152px center;
      animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.10s backwards;
    }
    .bar-anim-2 {
      transform-origin: 152px center;
      animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s backwards;
    }
    .bar-anim-3 {
      transform-origin: 152px center;
      animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.40s backwards;
    }
    .bar-anim-4 {
      transform-origin: 152px center;
      animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s backwards;
    }
    .bar-anim-5 {
      transform-origin: 152px center;
      animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.70s backwards;
    }

    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Number / Label Fade in */
    .telemetry-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, Helvetica, Arial, sans-serif;
    }
    .mono-num {
      font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .dashboard-container {
        animation: none !important;
        transform: perspective(800px) rotateX(8deg) !important;
      }
      .bar-anim-1, .bar-anim-2, .bar-anim-3, .bar-anim-4, .bar-anim-5, .status-led {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>

  <!-- 3D Perspective Floating Group -->
  <g class="dashboard-container">
    <!-- 3D Physical Extruded Slab Under-Shadow -->
    <rect x="24" y="24" width="652" height="162" rx="10" fill="#000000" fill-opacity="0.5" />
    <!-- 3D Physical Slab Bottom Thickness Bevel -->
    <path d="M 28 178 L 36 186 L 664 186 L 672 178 Z" fill="url(#slabEdgeDark)" />

    <!-- Main Glassmorphism Card Body -->
    <rect x="25" y="16" width="650" height="162" rx="8" fill="url(#cardBgDark)" stroke="url(#borderGlow)" stroke-width="1.2" />

    <!-- Cyber Grid Overlay inside Card -->
    <rect x="26" y="17" width="648" height="160" rx="7" fill="url(#cyberGrid)" />

    <!-- Futuristic HUD Corner Brackets -->
    <!-- Top-Left -->
    <path d="M 33 28 L 33 22 L 39 22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Top-Right -->
    <path d="M 661 22 L 667 22 L 667 28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Bottom-Left -->
    <path d="M 33 166 L 33 172 L 39 172" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <!-- Bottom-Right -->
    <path d="M 661 172 L 667 172 L 667 166" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />

    <!-- HEADER SECTION -->
    <g transform="translate(38, 36)">
      <!-- Pulsing Telemetry Dot -->
      <circle cx="2" cy="-4" r="3.5" fill="#38bdf8" class="status-led" />
      <!-- Header Title -->
      <text x="14" y="0" class="telemetry-text" fill="#f0f6fc" font-size="12" font-weight="700" letter-spacing="1">SYSTEM LANGUAGE SPECTRUM</text>
      <text x="245" y="0" class="telemetry-text" fill="#8b949e" font-size="10" font-weight="500" letter-spacing="0.5">// 3D PERSPECTIVE HUD</text>

      <!-- Right Header Telemetry Badges -->
      <rect x="475" y="-10" width="138" height="16" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <circle cx="486" cy="-2" r="2.5" fill="#22c55e" />
      <text x="494" y="2" class="mono-num" fill="#7ee787" font-size="9" font-weight="600">SYS.STATUS: OPERATIONAL</text>
    </g>

    <!-- Header Divider Line with Center Tick -->
    <line x1="38" y1="46" x2="662" y2="46" stroke="#21262d" stroke-width="1" />
    <line x1="185" y1="44" x2="185" y2="48" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="565" y1="44" x2="565" y2="48" stroke="#818cf8" stroke-width="1.5" />

    <!-- 5 LANGUAGE ROWS (y: 52 to 166) -->

    <!-- ROW 1: Jupyter Notebook (45.98%) -->
    <g transform="translate(38, 62)">
      <circle cx="4" cy="0" r="4.5" fill="#DA5B0B" />
      <text x="16" y="4" class="telemetry-text" fill="#c9d1d9" font-size="11" font-weight="600">Jupyter Notebook</text>
      <!-- Track (375px max) -->
      <rect x="152" y="-4" width="375" height="8" rx="4" fill="url(#trackBgDark)" stroke="#21262d" stroke-width="0.5" />
      <!-- Bar Fill: 375 * 0.4598 = 172.4px -->
      <rect class="bar-anim-1" x="152" y="-4" width="172.4" height="8" rx="4" fill="url(#gradJupyter)" />
      <!-- Percentage Value -->
      <text x="540" y="4" class="mono-num" fill="#f0f6fc" font-size="11" font-weight="700">45.98%</text>
      <!-- Visual Rank Badge -->
      <text x="596" y="3" class="mono-num" fill="#DA5B0B" font-size="9" font-weight="600">[P1]</text>
    </g>

    <!-- ROW 2: Python (36.57%) -->
    <g transform="translate(38, 86)">
      <circle cx="4" cy="0" r="4.5" fill="#3572A5" />
      <text x="16" y="4" class="telemetry-text" fill="#c9d1d9" font-size="11" font-weight="600">Python</text>
      <!-- Track -->
      <rect x="152" y="-4" width="375" height="8" rx="4" fill="url(#trackBgDark)" stroke="#21262d" stroke-width="0.5" />
      <!-- Bar Fill: 375 * 0.3657 = 137.1px -->
      <rect class="bar-anim-2" x="152" y="-4" width="137.1" height="8" rx="4" fill="url(#gradPython)" />
      <!-- Percentage Value -->
      <text x="540" y="4" class="mono-num" fill="#f0f6fc" font-size="11" font-weight="700">36.57%</text>
      <!-- Visual Rank Badge -->
      <text x="596" y="3" class="mono-num" fill="#3572A5" font-size="9" font-weight="600">[P2]</text>
    </g>

    <!-- ROW 3: JavaScript (6.17%) -->
    <g transform="translate(38, 110)">
      <circle cx="4" cy="0" r="4.5" fill="#f1e05a" />
      <text x="16" y="4" class="telemetry-text" fill="#c9d1d9" font-size="11" font-weight="600">JavaScript</text>
      <!-- Track -->
      <rect x="152" y="-4" width="375" height="8" rx="4" fill="url(#trackBgDark)" stroke="#21262d" stroke-width="0.5" />
      <!-- Bar Fill: 375 * 0.0617 = 23.1px -->
      <rect class="bar-anim-3" x="152" y="-4" width="23.1" height="8" rx="4" fill="url(#gradJS)" />
      <!-- Percentage Value -->
      <text x="540" y="4" class="mono-num" fill="#f0f6fc" font-size="11" font-weight="700"> 6.17%</text>
      <!-- Visual Rank Badge -->
      <text x="596" y="3" class="mono-num" fill="#f1e05a" font-size="9" font-weight="600">[P3]</text>
    </g>

    <!-- ROW 4: TypeScript (3.87%) -->
    <g transform="translate(38, 134)">
      <circle cx="4" cy="0" r="4.5" fill="#3178c6" />
      <text x="16" y="4" class="telemetry-text" fill="#c9d1d9" font-size="11" font-weight="600">TypeScript</text>
      <!-- Track -->
      <rect x="152" y="-4" width="375" height="8" rx="4" fill="url(#trackBgDark)" stroke="#21262d" stroke-width="0.5" />
      <!-- Bar Fill: 375 * 0.0387 = 14.5px -->
      <rect class="bar-anim-4" x="152" y="-4" width="14.5" height="8" rx="4" fill="url(#gradTS)" />
      <!-- Percentage Value -->
      <text x="540" y="4" class="mono-num" fill="#f0f6fc" font-size="11" font-weight="700"> 3.87%</text>
      <!-- Visual Rank Badge -->
      <text x="596" y="3" class="mono-num" fill="#3178c6" font-size="9" font-weight="600">[P4]</text>
    </g>

    <!-- ROW 5: Java (2.46%) -->
    <g transform="translate(38, 158)">
      <circle cx="4" cy="0" r="4.5" fill="#b07219" />
      <text x="16" y="4" class="telemetry-text" fill="#c9d1d9" font-size="11" font-weight="600">Java</text>
      <!-- Track -->
      <rect x="152" y="-4" width="375" height="8" rx="4" fill="url(#trackBgDark)" stroke="#21262d" stroke-width="0.5" />
      <!-- Bar Fill: 375 * 0.0246 = 9.2px -->
      <rect class="bar-anim-5" x="152" y="-4" width="9.2" height="8" rx="4" fill="url(#gradJava)" />
      <!-- Percentage Value -->
      <text x="540" y="4" class="mono-num" fill="#f0f6fc" font-size="11" font-weight="700"> 2.46%</text>
      <!-- Visual Rank Badge -->
      <text x="596" y="3" class="mono-num" fill="#b07219" font-size="9" font-weight="600">[P5]</text>
    </g>

  </g>
</svg>
