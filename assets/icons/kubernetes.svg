<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Kubernetes</title>
  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0B1B36" stroke="#326CE5" stroke-width="1.5"/>
  <!-- Central Control Plane Hexagon -->
  <polygon points="32,23 40,28 40,36 32,41 24,36 24,28" fill="#326CE5" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Core Brain Node -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
  <!-- 6 Orchestrated Pod Nodes & Cluster Mesh Links -->
  <g stroke="#60A5FA" stroke-width="1.5">
    <line x1="32" y1="23" x2="32" y2="15"/>
    <line x1="40" y1="28" x2="47" y2="24"/>
    <line x1="40" y1="36" x2="47" y2="40"/>
    <line x1="32" y1="41" x2="32" y2="49"/>
    <line x1="24" y1="36" x2="17" y2="40"/>
    <line x1="24" y1="28" x2="17" y2="24"/>
  </g>
  <circle cx="32" cy="14" r="2.5" fill="#FFFFFF"/>
  <circle cx="48" cy="23" r="2.5" fill="#FFFFFF"/>
  <circle cx="48" cy="41" r="2.5" fill="#FFFFFF"/>
  <circle cx="32" cy="50" r="2.5" fill="#FFFFFF"/>
  <circle cx="16" cy="41" r="2.5" fill="#FFFFFF"/>
  <circle cx="16" cy="23" r="2.5" fill="#FFFFFF"/>
</svg>