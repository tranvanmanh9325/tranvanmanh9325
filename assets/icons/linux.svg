<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Linux</title>
  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#17191E" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Protective UNIX Kernel Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Kernel Crosshair Guides -->
  <line x1="32" y1="8" x2="32" y2="13" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="32" y1="51" x2="32" y2="56" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="13" y2="32" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="51" y1="32" x2="56" y2="32" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Terminal Prompt >_ -->
  <path d="M23 26l7 6-7 6" fill="none" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="38" x2="41" y2="38" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
