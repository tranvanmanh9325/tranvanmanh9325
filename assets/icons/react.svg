<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>React</title>
  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#081E2B" stroke="#00D8FF" stroke-width="1.5"/>
  <!-- 3 Geometric Component Blades / Reactive Loop -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="4.5" fill="#00D8FF"/>
    <!-- Blade 1 -->
    <path d="M0 -6 C6 -18, 14 -18, 0 -22 C-14 -18, -6 -18, 0 -6" fill="none" stroke="#00D8FF" stroke-width="1.8"/>
    <!-- Blade 2 (120 deg) -->
    <path d="M0 -6 C6 -18, 14 -18, 0 -22 C-14 -18, -6 -18, 0 -6" fill="none" stroke="#00D8FF" stroke-width="1.8" transform="rotate(120)"/>
    <!-- Blade 3 (240 deg) -->
    <path d="M0 -6 C6 -18, 14 -18, 0 -22 C-14 -18, -6 -18, 0 -6" fill="none" stroke="#00D8FF" stroke-width="1.8" transform="rotate(240)"/>
    <!-- Orbital Outer Sync Rings -->
    <circle cx="0" cy="-14" r="2" fill="#FFFFFF"/>
    <circle cx="12" cy="7" r="2" fill="#FFFFFF"/>
    <circle cx="-12" cy="7" r="2" fill="#FFFFFF"/>
  </g>
</svg>