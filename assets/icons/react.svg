<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>React</title>
  <!-- Central Core Nucleus -->
  <circle cx="32" cy="32" r="5.5" fill="#087EA4"/>
  <!-- Orbital Electron Ring 1 -->
  <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#087EA4" stroke-width="3.2"/>
  <!-- Orbital Electron Ring 2 (60 deg) -->
  <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#087EA4" stroke-width="3.2" transform="rotate(60 32 32)"/>
  <!-- Orbital Electron Ring 3 (120 deg) -->
  <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#087EA4" stroke-width="3.2" transform="rotate(120 32 32)"/>
</svg>