<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Git</title>
  <!-- Main Trunk Branch Line -->
  <line x1="24" y1="18" x2="24" y2="46" stroke="#F05032" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Feature Splice Branch Curve -->
  <path d="M24 38c0-8 18-6 18-14v-6" fill="none" stroke="#F05032" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Commit Node 1 (Trunk Top) -->
  <circle cx="24" cy="18" r="6" fill="#F05032"/>
  <circle cx="24" cy="18" r="2.5" fill="#FFFFFF"/>
  <!-- Commit Node 2 (Trunk Bottom) -->
  <circle cx="24" cy="46" r="6" fill="#F05032"/>
  <circle cx="24" cy="46" r="2.5" fill="#FFFFFF"/>
  <!-- Commit Node 3 (Feature Branch) -->
  <circle cx="42" cy="18" r="6" fill="#F05032"/>
  <circle cx="42" cy="18" r="2.5" fill="#FFFFFF"/>
</svg>