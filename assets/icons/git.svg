<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Git</title>
  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#26100B" stroke="#F05032" stroke-width="1.5"/>
  <!-- Main Trunk Line -->
  <line x1="24" y1="18" x2="24" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Feature Branch Splice Curve -->
  <path d="M24 36c0-6 16-4 16-10v-8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Commit Nodes -->
  <circle cx="24" cy="20" r="4" fill="#F05032" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="24" cy="44" r="4" fill="#F05032" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="40" cy="18" r="4" fill="#F05032" stroke="#FFFFFF" stroke-width="2"/>
</svg>