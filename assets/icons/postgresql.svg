<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>PostgreSQL</title>
  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0B1A28" stroke="#336791" stroke-width="1.5"/>
  <!-- Top Storage Cylinder -->
  <ellipse cx="32" cy="20" rx="15" ry="5" fill="#1E4970" stroke="#336791" stroke-width="1.5"/>
  <!-- Mid Storage Cylinder -->
  <path d="M17 20v10c0 2.8 6.7 5 15 5s15-2.2 15-5V20" fill="none" stroke="#336791" stroke-width="1.5"/>
  <path d="M17 30v10c0 2.8 6.7 5 15 5s15-2.2 15-5V30" fill="none" stroke="#336791" stroke-width="1.5"/>
  <!-- Relational Tuples & Schema Link Nodes -->
  <circle cx="25" cy="29" r="2" fill="#38BDF8"/>
  <circle cx="39" cy="39" r="2" fill="#38BDF8"/>
  <path d="M25 29l14 10" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PG</text>
</svg>