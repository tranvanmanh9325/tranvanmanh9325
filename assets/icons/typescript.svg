<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>TypeScript</title>
  <!-- Base Squircle Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0A1B2E" stroke="#3178C6" stroke-width="1.5"/>
  <!-- Generic Type Angles < > -->
  <path d="M19 25l-5 7 5 7" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 25l5 7-5 7" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Modern Geometric Monogram TS -->
  <text x="32" y="37.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TS</text>
  <!-- Type Strictness Badge Dot -->
  <circle cx="41" cy="24" r="2" fill="#38BDF8"/>
</svg>