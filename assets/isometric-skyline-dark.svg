<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <linearGradient id="headerGrad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <style>
    /* CSS @keyframes animation for upward growth */
    @keyframes growUp {
      0% {
        transform: scaleY(0);
        opacity: 0.1;
      }
      60% {
        transform: scaleY(1.04);
        opacity: 1;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .card-bg {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1.5;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: #F0F6FC;
    }

    .subtitle-text {
      font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #8B949E;
    }

    .badge-bg {
      fill: #161B22;
      stroke: #38BDF8;
      stroke-width: 1;
    }

    .badge-text {
      font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #38BDF8;
    }

    .axis-label {
      font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 500;
      fill: #8B949E;
    }

    .bar-col {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: growUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Accessibility: Respect Reduced Motion Preference */
    @media (prefers-reduced-motion: reduce) {
      .bar-col, .pulse-beacon {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }

    .iso-plane {
      opacity: 0.35;
    }
  </style>

  <!-- Background Card -->
  <rect width="958" height="218" x="1" y="1" rx="10" class="card-bg" />

  <!-- Header Section -->
  <g transform="translate(24, 26)">
    <!-- 3D Cube Icon -->
    <g transform="translate(0, -12)">
      <path d="M 0 6 L 8 2 L 16 6 L 8 10 Z" fill="#67E8F9" />
      <path d="M 0 6 L 8 10 L 8 18 L 0 14 Z" fill="#22D3EE" />
      <path d="M 8 10 L 16 6 L 16 14 L 8 18 Z" fill="#0891B2" />
    </g>

    <text x="26" y="0" class="title-text">ISOMETRIC 3D CONTRIBUTION SKYLINE</text>
    <text x="26" y="15" class="subtitle-text">30-Day Activity Vector • Total: 450 Contributions • Velocity: Peak 40/day</text>
  </g>

  <!-- Telemetry Badge -->
  <g transform="translate(810, 16)">
    <rect width="126" height="24" rx="12" class="badge-bg" />
    <circle cx="14" cy="12" r="3.5" fill="#38BDF8" class="pulse-beacon" />
    <text x="25" y="15.5" class="badge-text">3D ISOMETRIC</text>
  </g>

