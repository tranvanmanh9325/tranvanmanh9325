    <line x1="0" y1="8" x2="880" y2="8" stroke="#21262D" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="16" x2="880" y2="16" stroke="#21262D" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Horizontal Baseline -->
