<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="100%" height="48" fill="none">
  <defs>
    <linearGradient id="hudGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16161e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1a1b27" stop-opacity="1"/>
      <stop offset="100%" stop-color="#16161e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="beamGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#70a5fd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes radarPing {
      0% { r: 4px; opacity: 1; stroke-width: 2px; }
      70% { r: 11px; opacity: 0; stroke-width: 1px; }
      100% { r: 11px; opacity: 0; stroke-width: 0; }
    }
    @keyframes scanSweep {
      0% { transform: translateX(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateX(1100px); opacity: 0.2; }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .hud-bg { fill: url(#hudGradDark); stroke: #3b4261; stroke-width: 1; rx: 6; }
    .ping-circle { animation: radarPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; stroke: #10b981; }
    .hud-title { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; fill: #70a5fd; animation: pulseText 3s ease-in-out infinite; }
    .hud-meta { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #9aa5ce; }
    .hud-badge { font-family: 'Fira Code', ui-monospace, monospace; font-size: 11px; font-weight: 700; fill: #10b981; letter-spacing: 0.5px; }
    .scan-beam { animation: scanSweep 4.5s ease-in-out infinite alternate; }

    @media (prefers-reduced-motion: reduce) {
      .ping-circle, .scan-beam, .hud-title {
        animation: none !important;
      }
    }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="1198" height="46" class="hud-bg" />

  <!-- Animated Laser Scan Beam -->
  <rect x="20" y="45" width="90" height="2" fill="url(#beamGradDark)" filter="url(#glowDark)" class="scan-beam" />

  <!-- Live Pulse Indicator & Title -->
  <circle cx="28" cy="24" r="5" fill="#10b981" />
  <circle cx="28" cy="24" r="4" fill="none" class="ping-circle" />
  <text x="44" y="28" class="hud-badge">LIVE OBSERVABILITY</text>
  <text x="200" y="28" class="hud-meta">|</text>
  <text x="216" y="28" class="hud-title">REAL-TIME CONTRIBUTION TELEMETRY</text>

  <!-- Systems Metrics Indicators -->
  <text x="830" y="28" class="hud-meta">SAMPLING: <tspan fill="#70a5fd">30D ROLLING</tspan> | RTT: <tspan fill="#10b981">&lt;2ms</tspan> | STATUS: <tspan fill="#10b981">OPTIMAL</tspan></text>
</svg>
